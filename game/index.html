<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbra Drift</title>
<meta name="description" content="Umbra Drift: a dark-cave arcade game where your light is the only thing that shows the way — and the only thing the hunters can see.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Umbra Drift: steer the last ember through a dark cave, gather every mote to open the way onward, hide with Shift and burn a flare with Space to stop the hunters"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
